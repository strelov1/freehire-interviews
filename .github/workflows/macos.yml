name: macOS build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify architecture and release tag
        run: |
          node <<'JS'
          const version = require('./package.json').version;
          const { TARGET_ARCH, GITHUB_REF_TYPE, GITHUB_REF_NAME } = process.env;
          if (process.arch !== TARGET_ARCH) throw Error('Unexpected runner architecture');
          if (GITHUB_REF_TYPE === 'tag' &&
              (!/^v\d+\.\d+\.\d+$/.test(GITHUB_REF_NAME) || GITHUB_REF_NAME !== 'v' + version)) {
            throw Error('The release tag must be vX.Y.Z and match package.json');
          }
          JS
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:renderer
      - run: npm run build:native
      - name: Package disk image
        run: npm exec -- electron-builder --mac dmg "--$TARGET_ARCH" --publish never
      - name: Verify packaged helpers
        shell: bash
        run: |
          app_path="$(find dist -type d -name 'Freehire Interviews.app' -prune -print -quit)"
          test -n "$app_path"
          test -f "$app_path/Contents/Resources/app.asar"
          codesign --verify --deep --strict "$app_path"
          architecture="$TARGET_ARCH"
          if [[ "$architecture" == x64 ]]; then architecture=x86_64; fi
          for helper in macos-audio-tap macos-mic-listener; do
            xcrun lipo "$app_path/Contents/Resources/bin/$helper" -verify_arch "$architecture"
          done
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: release
          merge-multiple: true
      - name: Publish disk images and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          version="${GITHUB_REF_NAME#v}"
          arm="Freehire-Interviews-$version-arm64.dmg"
          intel="Freehire-Interviews-$version-x64.dmg"
          sha256sum "$arm" "$intel" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes --title "Freehire Interviews $GITHUB_REF_NAME" \
            "$arm" "$intel" SHA256SUMS.txt
