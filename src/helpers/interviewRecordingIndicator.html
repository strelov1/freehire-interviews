<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Freehire recording</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      .pill {
        -webkit-app-region: drag;
        user-select: none;
        box-sizing: border-box;
        width: 96px;
        height: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 999px;
        border: 1px solid #55555c;
        color: #f4f4f6;
        background: #242429;
        font:
          650 11px -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        animation: reveal 180ms cubic-bezier(0.2, 0.75, 0.3, 1) both;
      }
      .open {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        flex: 1;
        height: 100%;
        border: 0;
        padding: 0;
        border-radius: 999px 0 0 999px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .open:hover,
      .open:focus-visible {
        background: #414148;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ff9299;
      }
      time {
        font-variant-numeric: tabular-nums;
      }
      .wave {
        display: flex;
        flex: 0 0 29px;
        height: 100%;
        justify-content: center;
        align-items: center;
        gap: 2px;
      }
      .wave > i {
        width: 2px;
        height: 13px;
        border-radius: 2px;
        background: currentColor;
        transform: scaleY(var(--scale, 0.2));
        transition: transform 95ms ease-out;
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(3px) scale(0.86);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-transparency: no-preference) {
        .pill {
          background: rgb(36 36 41 / 88%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pill {
          animation: none;
        }
        .wave > i {
          transform: scaleY(0.4);
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="pill">
      <button
        class="open"
        type="button"
        aria-label="Open Freehire while recording"
        title="Open Freehire"
      >
        <span class="dot" aria-hidden="true"></span>
        <time aria-hidden="true">00:00</time>
      </button>
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </div>
  </body>
</html>
